experiment:
  name: robustrag_pilot_run
  description: Pilot study to verify degradation curves and reranker mitigation
  random_seed: 42
  is_smoke_test: false
dataset:
  name: squad
  split: validation
  sample_size: 15
  cache_dir: ./.cache/datasets
  fallback_path: ./data/squad_sample_fallback.json
models:
  generator:
    backend: groq
    model_name: google/flan-t5-small
    groq_model: qwen/qwen3.8-27b
    max_input_length: 1024
    max_new_tokens: 32
    temperature: 0.0
    do_sample: false
  reranker:
    backend: local
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    batch_size: 16
noise_settings:
  quantities:
  - 0
  - 1
  - 3
  - 5
  distractor_types:
  - random
  - hard
  fixed_distractor_count: 3
  hard_distractor_pool_size: 8
experiments:
  run_experiment_a: true
  run_experiment_b: true
  run_experiment_c: true
  run_experiment_d: true
  top_k_filter: 3
  run_retrieval_realistic: true
  realistic_retrieval_k:
  - 1
  - 3
  - 5
evaluation:
  metrics:
  - f1
  - exact_match
  bootstrap_iterations: 500
  confidence_level: 0.95
  bootstrap_seed: 42
storage:
  output_dir: ./outputs/runs
  cache_inference: true
